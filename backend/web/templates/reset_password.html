<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password — CARDex</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #f5f7fa 0%,
                    #e9eef5 100%
                );
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 12px;
            border-radius: 14px;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .brand h1 {
            margin: 0;
            font-size: 25px;
            font-weight: 700;
        }

        .brand p {
            margin: 6px 0 0;
            color: #6b7280;
            font-size: 13px;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 32px;
            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.08);
        }

        .card-header {
            margin-bottom: 26px;
        }

        .card-header h2 {
            margin: 0 0 8px;
            font-size: 21px;
        }

        .card-header p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
        }

        .error {
            margin-bottom: 20px;
            padding: 12px 14px;
            border-radius: 10px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            font-size: 13px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }

        .password-wrapper {
            position: relative;
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            height: 46px;
            padding: 0 46px 0 13px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }

        input:focus {
            border-color: #111827;
            box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.08);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #6b7280;
            cursor: pointer;
            font-size: 12px;
            padding: 5px;
        }

        .toggle-password:hover {
            color: #111827;
        }

        .requirements {
            margin: 4px 0 22px;
            color: #6b7280;
            font-size: 12px;
            line-height: 1.5;
        }

        button[type="submit"] {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 10px;
            background: #111827;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition:
                background 0.2s,
                transform 0.1s;
        }

        button[type="submit"]:hover {
            background: #1f2937;
        }

        button[type="submit"]:active {
            transform: scale(0.99);
        }

        button[type="submit"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #9ca3af;
            font-size: 11px;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .card {
                padding: 24px;
                border-radius: 15px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="brand">
        <div class="logo">C</div>

        <h1>CARDex</h1>

        <p>
            Centralized Academic Resource Database & Exchange
        </p>
    </div>

    <div class="card">

        <div class="card-header">
            <h2>Reset your password</h2>

            <p>
                Enter a new password for your CARDex account.
            </p>
        </div>

        {{if .Error}}
        <div class="error">
            {{.Error}}
        </div>
        {{end}}

        <form
            method="POST"
            action="/auth/reset-password"
            id="resetForm"
        >

            <input
                type="hidden"
                name="token"
                value="{{.Token}}"
            >

            <div class="field">
                <label for="password">
                    New Password
                </label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        minlength="8"
                        autocomplete="new-password"
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('password', this)"
                    >
                        Show
                    </button>
                </div>
            </div>

            <div class="field">
                <label for="confirm_password">
                    Confirm Password
                </label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        required
                        minlength="8"
                        autocomplete="new-password"
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('confirm_password', this)"
                    >
                        Show
                    </button>
                </div>
            </div>

            <div class="requirements">
                Password must contain at least 8 characters.
            </div>

            <button
                type="submit"
                id="submitButton"
            >
                Reset Password
            </button>

        </form>

    </div>

    <div class="footer">
        © {{.CurrentYear}} CARDex Smart Library
    </div>

</div>

<script>
    function togglePassword(id, button) {
        const input = document.getElementById(id);

        if (input.type === "password") {
            input.type = "text";
            button.textContent = "Hide";
        } else {
            input.type = "password";
            button.textContent = "Show";
        }
    }

    document.getElementById("resetForm").addEventListener("submit", function () {
        const button = document.getElementById("submitButton");

        button.disabled = true;
        button.textContent = "Resetting...";
    });
</script>

</body>
</html>
