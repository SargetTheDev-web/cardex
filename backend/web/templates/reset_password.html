<form method="POST" action="/auth/reset-password">
    <input
        type="hidden"
        name="token"
        value="{{.Token}}"
    >

    <label for="password">New Password</label>
    <input
        type="password"
        id="password"
        name="password"
        required
        minlength="8"
    >

    <label for="confirm_password">Confirm Password</label>
    <input
        type="password"
        id="confirm_password"
        name="confirm_password"
        required
        minlength="8"
    >

    <button type="submit">
        Reset Password
    </button>
</form>
